[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-forecasts-dev-harness"
version = "0.1.0"
description = "サブエージェントによるローカル開発ハーネス"
requires-python = ">=3.12"

[project.scripts]
dev-harness = "dev_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
